<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.revatech.cz/">
<meta http-equiv="refresh" content="0; url=https://www.revatech.cz/">
<title>REVATECH s.r.o. – www.revatech.cz</title>
<script>
  // Náhled se přestěhoval na ostrý web — stejná stránka tam, kde to jde.
  var p = location.pathname.replace(/^\/revatech-web/, "");
  var ok = /^\/(produkty(\/[a-z0-9-]+)?|o-nas|kontakty)\/?$/.test(p);
  location.replace("https://www.revatech.cz" + (ok ? p.replace(/\/?$/, "/") : "/"));
</script>
</head>
<body><p>Web REVATECH s.r.o. najdete na <a href="https://www.revatech.cz/">www.revatech.cz</a>.</p></body>
